---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: echo-1
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/enable-rewrite-log: "true"
spec:
  ingressClassName: nginx-default
  rules:
  - host: example.com
    http:
      paths:
      - path: /echo1
        pathType: Prefix
        backend:
          service:
            name: echo-service
            port:
              number: 80
