# Official Mirantis sf-notifier Salesforce Authentication Credentials
# Expected environment variables from Mirantis ucp-sf-notifier production settings:
apiVersion: v1
kind: Secret
metadata:
  name: sf-notifier-credentials
  namespace: kof
type: Opaque
stringData:
  # [ENV CHECK]: Mirantis Salesforce Service Account Username
  SFDC_USERNAME: "support-automation@your-domain.com"

  # [ENV CHECK]: Mirantis Salesforce Service Account Password
  SFDC_PASSWORD: "your-salesforce-password"

  # [ENV CHECK]: Mirantis Salesforce Environment ID (Environment2__c ID in Salesforce)
  SFDC_ENVIRONMENT_ID: "your-environment-id"

  # [ENV CHECK]: Mirantis Salesforce Organization ID (e.g. 00D...)
  SFDC_ORGANIZATION_ID: "your-organization-id"

  # [ENV CHECK]: Salesforce Auth URL (default: https://login.salesforce.com)
  SFDC_AUTH_URL: "https://login.salesforce.com"

  # [ENV CHECK]: Set to "True" if targeting a Salesforce Sandbox environment, else "False"
  SFDC_SANDBOX_ENABLED: "False"

  # [ENV CHECK]: Logging verbosity (INFO, DEBUG, WARNING, ERROR)
  LOGGER_LEVEL: "INFO"
