apiVersion: v1
kind: Secret
metadata:
  name: sf-notifier-credentials
  namespace: kof
type: Opaque
stringData:
  # [ENV CHECK]: Mirantis Salesforce Service Account Username
  SF_USERNAME: "support-automation@your-domain.com"

  # [ENV CHECK]: Salesforce Account Password
  SF_PASSWORD: "your-salesforce-password"

  # [ENV CHECK]: Salesforce API Security Token
  SF_SECURITY_TOKEN: "your-security-token"

  # [ENV CHECK]: Connected App OAuth Consumer Key
  SF_CONSUMER_KEY: "3MVG9...your-consumer-key"

  # [ENV CHECK]: Connected App OAuth Consumer Secret
  SF_CONSUMER_SECRET: "your-consumer-secret"
