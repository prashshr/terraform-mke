# Template for sf-notifier Mirantis Salesforce Authentication Credentials
# Fill in your Mirantis Salesforce service account credentials and apply to the 'kof' namespace.
apiVersion: v1
kind: Secret
metadata:
  name: sf-notifier-credentials
  namespace: kof
type: Opaque
stringData:
  # [ENV CHECK]: Mirantis Salesforce Service Account Username
  SF_USERNAME: "support-automation@your-domain.com"

  # [ENV CHECK]: Mirantis Salesforce Service Account Password
  SF_PASSWORD: "your-salesforce-password"

  # [ENV CHECK]: Target Salesforce Environment ("production" or "sandbox")
  SF_ENVIRONMENT: "production"

  # [ENV CHECK]: Mirantis Salesforce Organization ID (15 or 18 chars, e.g. 00D...)
  SF_ORGANIZATION_ID: "00D000000000000"
