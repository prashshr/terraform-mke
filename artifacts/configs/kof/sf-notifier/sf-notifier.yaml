apiVersion: apps/v1
kind: Deployment
metadata:
  name: sf-notifier
  namespace: kof
  labels:
    app: sf-notifier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sf-notifier
  template:
    metadata:
      labels:
        app: sf-notifier
    spec:
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      containers:
        - name: sf-notifier
          # Official Mirantis Salesforce Notifier Image
          image: docker.io/mirantis/ucp-sf-notifier:3.8.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - secretRef:
                name: sf-notifier-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /info
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /info
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sf-notifier
  namespace: kof
  labels:
    app: sf-notifier
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  selector:
    app: sf-notifier
