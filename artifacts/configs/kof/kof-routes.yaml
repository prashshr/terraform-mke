apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mke-gateway-kof
  namespace: kof
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: mke
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kof-grafana-httproute
  namespace: mke
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: mke-gateway-ingress-nodeport-https
  hostnames:
  - ${KOF_DOM}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: grafana-vm-service
      namespace: kof
      port: 3000
      weight: 1
