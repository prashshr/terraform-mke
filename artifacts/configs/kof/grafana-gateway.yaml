# Dedicated Envoy Gateway exposing Grafana over HTTPS, for MKE4 (Gateway API +
# Envoy Gateway, GatewayClass "mke-gateway-ingress"). Applied when
# kof_grafana_gateway_enabled=true, AFTER the Grafana instance exists.
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kof-grafana-selfsigned
  namespace: kof
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kof-grafana
  namespace: kof
spec:
  secretName: kof-grafana-tls
  issuerRef:
    name: kof-grafana-selfsigned
    kind: Issuer
  dnsNames:
    - grafana.kof.local
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: kof-grafana-nodeport
  namespace: kof
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              externalTrafficPolicy: Cluster
              ports:
                - port: 443
                  nodePort: 34001
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kof-grafana
  namespace: kof
spec:
  gatewayClassName: mke-gateway-ingress
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: kof-grafana-nodeport
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: kof-grafana-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kof-grafana
  namespace: kof
spec:
  parentRefs:
    - name: kof-grafana
  rules:
    - backendRefs:
        - name: grafana-vm-service
          port: 3000
