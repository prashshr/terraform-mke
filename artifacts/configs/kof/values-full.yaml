          name: crd-sidecar
          volumeMounts:
          - mountPath: /etc/config
            name: config-volume
          - mountPath: /script
            name: compile-script
        extraArgs:
        - --custom-resource-state-config-file=/etc/config/crd-metrics-config.yaml
        - --custom-resource-state-only
        initContainers:
        - command:
          - /bin/sh
          - -c
          - "cat << EOF > \"/etc/config/crd-metrics-config.yaml\"\nkind: CustomResourceStateMetrics\n\
            spec:\n  resources: []\nEOF\n"
          image: registry.mirantis.com/k0rdent-enterprise/kiwigrid/k8s-sidecar:2.1.4
          name: init-crd-config
          volumeMounts:
          - mountPath: /etc/config
            name: config-volume
      kubeApiServer:
        enabled: false
      kubeProxy:
        enabled: false
      nodeExporter:
        enabled: false
      prometheus-node-exporter:
        hostNetwork: false
    opentelemetry-operator:
