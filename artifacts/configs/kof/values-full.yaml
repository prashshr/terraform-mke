      repo:
        spec:
          url: oci://registry.mirantis.com/k0rdent-enterprise/charts
    kcm:
      kof:
        acl:
          image:
            registry: registry.mirantis.com/k0rdent-enterprise
        operator:
          image:
            registry: registry.mirantis.com/k0rdent-enterprise
      monitoring: true
      namespace: k0rdent
    opencost:
      enabled: true
      opencost:
        exporter:
          image:
            registry: registry.mirantis.com/k0rdent-enterprise
        ui:
          image:
            registry: registry.mirantis.com/k0rdent-enterprise
    opentelemetry-kube-stack:
      clusterName: mothership
