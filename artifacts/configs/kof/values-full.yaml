        daemon:
          image:
            repository: registry.mirantis.com/k0rdent-enterprise/kof/kof-opentelemetry-collector-contrib
        target-allocator:
          targetAllocator:
            image: registry.mirantis.com/k0rdent-enterprise/opentelemetry-operator/target-allocator:v0.143.0
      coreDns:
        enabled: false
      defaultCRConfig:
        config:
          exporters:
            prometheusremotewrite:
              external_labels:
                cluster: mothership
                clusterNamespace: k0rdent
          processors:
            resource/k8sclustername:
              attributes:
              - action: insert
                key: k8s.cluster.name
                value: mothership
              - action: insert
                key: k8s.cluster.namespace
                value: k0rdent
      kube-state-metrics:
        containers:
        - env:
          - name: HEALTH_PORT
            value: '8088'
