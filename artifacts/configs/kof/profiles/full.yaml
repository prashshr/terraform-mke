# ─── KOF Deployment Profile: FULL ───────────────────────────────────────────
# Full observability + FinOps platform:
#   - VictoriaMetrics + VictoriaLogs + VictoriaTraces (tracing enabled)
#   - OpenCost FinOps cost reporting
#   - OpenTelemetry collectors + Prometheus node exporter
#   - KCM and Nvidia GPU dashboards
# ──────────────────────────────────────────────────────────────────────────

kof-regional:
  enabled: false
kof-child:
  enabled: false

kof-storage:
  enabled: true
  values:
    victoria-traces-cluster:
      enabled: true

kof-collectors:
  enabled: true
  values:
    opencost:
      enabled: true
    kcm:
      monitoring: true
    opentelemetry-kube-stack:
      clusterName: mothership
      prometheus-node-exporter:
        hostNetwork: false
