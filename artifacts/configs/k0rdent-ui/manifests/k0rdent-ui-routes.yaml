apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mke-gateway-k0rdent
  namespace: k0rdent
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    namespace: mke
  to:
  - group: ""
    kind: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k0rdent-ui-httproute
  namespace: mke
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: mke-gateway-ingress-nodeport-https
  hostnames:
  - ${K0RDENT_DOM}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: kcm-k0rdent-ui
      namespace: k0rdent
      port: 3000
      weight: 1
