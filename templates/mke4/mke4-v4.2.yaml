apiVersion: mke.mirantis.com/v1alpha1
kind: MkeConfig
metadata:
  name: mke
  namespace: mke
spec:
  airgap:
    enabled: false
  apiServer:
    audit:
      enabled: false
      level: Metadata
      logPath: /var/log/mke4/audit/audit.log
      maxAge: 30
      maxBackup: 10
      maxSize: 10
      policyFile: /etc/audit_policy.yaml
    encryptionProvider: /var/lib/k0s/encryption.cfg
    eventRateLimit:
      enabled: false
    externalAddress: ""
    requestTimeout: 1m0s
  authentication:
    expiry: {}
    ldap:
      enabled: false
    oidc:
      enabled: false
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 128Mi
    saml:
      enabled: false
  cloudProvider:
    enabled: false
    provider: aws
  componentScheduling:
    enabled: true
    topologySpreadConstraints:
    - matchLabelKeys:
      - pod-template-hash
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
  controllerManager:
    terminatedPodGCThreshold: 12500
  devicePlugins:
    nvidiaGPU:
      enabled: false
      mig: {}
  dns:
    lameduck: {}
  envoyGateway:
    nodeSelector:
      kubernetes.io/os: linux
    resources: {}
    tolerations:
    - effect: NoSchedule
      key: node-role.kubernetes.io/master
      operator: Exists
      value: ""
    - effect: NoSchedule
      key: node-role.kubernetes.io/control-plane
      operator: Exists
      value: ""
  etcd: {}
  gatewayMKEIngress:
    envoyProxy:
      podDisruptionBudget:
        maxUnavailable: 1
      resources: {}
    nodePorts:
      http: 33000
      https: 33001
    ports:
      http: 80
      https: 443
  hosts:
  - role: controller+worker
    ssh:
      address: 1.2.3.4
      keyPath: /root/.ssh/id_rsa
      port: 22
      user: root
  ingressController:
    affinity:
      nodeAffinity: {}
    enabled: false
    extraArgs:
      enableSslPassthrough: false
    nodePorts: {}
    ports: {}
  k8sProviderSpecs:
    dataDir: /var/lib/k0s
  kubelet:
    eventRecordQPS: 50
    kubeletRootDir: /var/lib/kubelet
    managerKubeReserved:
      cpu: 250m
      ephemeral-storage: 4Gi
      memory: 2Gi
    maxPods: 110
    podPidsLimit: -1
    podsPerCore: 0
    protectKernelDefaults: false
    seccompDefault: false
    workerKubeReserved:
      cpu: 50m
      ephemeral-storage: 500Mi
      memory: 300Mi
  license:
    token: ""
  monitoring:
    enableCAdvisor: false
    grafana:
      ingress: {}
    prometheus: {}
  network:
    controlPlaneLoadBalancing:
      enabled: false
    kubeProxy:
      iptables:
        minSyncPeriod: 0s
        syncPeriod: 0s
      ipvs:
        minSyncPeriod: 0s
        syncPeriod: 0s
        tcpFinTimeout: 0s
        tcpTimeout: 0s
        udpTimeout: 0s
      metricsBindAddress: 0.0.0.0:10249
      mode: iptables
      nftables:
        minSyncPeriod: 0s
        syncPeriod: 0s
    multus:
      enabled: false
    nodePortRange: 32768-35535
    providers:
    - enabled: true
      extraConfig:
        cidrV4: 192.168.0.0/16
        linuxDataplane: Iptables
        loglevel: Info
      provider: calico
    - enabled: false
      provider: custom
    serviceCIDR: 10.96.0.0/16
  nodeLocalDNS:
    enabled: false
    nodeLocalConfigPersist: false
    resources:
      requests: {}
  operator: {}
  policyController:
    opaGatekeeper:
      enabled: false
  registries:
    chartRegistry:
      url: oci://registry.mirantis.com/mke
    imageRegistry:
      url: registry.mirantis.com/mke
  scheduler: {}
  secretsStoreCSIDriver:
    automountServiceAccountToken: true
    enabled: false
    linux:
      enabled: true
    maxCallRecvMsgSize: 4194304
    syncSecret: false
    windows:
      enabled: false
  tracking:
    enabled: true
  ui:
    resources:
      limits:
        memory: 128Mi
      requests:
        cpu: 50m
        memory: 64Mi
  version: v4.2.0
  windows:
    gmsa:
      enabled: false
